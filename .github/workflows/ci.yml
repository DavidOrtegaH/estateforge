# Continuous integration: install, lint, type-check, tests (with an ephemeral PostgreSQL), builds,
# dependency audit and commit message policy. It uses no secrets, deploys nothing and only reads
# the repository.
name: CI

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag or commit to validate (empty uses the selected branch)'
        required: false
        type: string
  push:
    branches: [main, develop, release, feature]
  pull_request:
    branches: [main, develop, release]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: 'true'
  # Ephemeral database of the PostgreSQL service below; not a secret.
  DATABASE_URL: postgresql://postgres@localhost:5432/estateforge_ci
  TEST_POSTGRES_ADMIN_URL: postgresql://postgres@localhost:5432/postgres

jobs:
  checks:
    name: Lint, types, tests and builds
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: estateforge_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm (version from packageManager)
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies from the lockfile
        run: pnpm install --frozen-lockfile

      - name: Commit messages follow the policy
        run: pnpm check:commits HEAD

      - name: Generate the Prisma client
        run: pnpm --filter api db:generate

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm typecheck

      - name: Apply migrations to the CI database
        run: pnpm --filter api db:migrate

      - name: Tests (shared, web, API with PostgreSQL integration tests)
        run: pnpm test

      - name: Tests of the repository scripts
        run: pnpm test:scripts

      - name: Build the shared package (compiled JavaScript for production)
        run: pnpm --filter @estateforge/shared build

      - name: Import the compiled shared package with plain Node (no loader)
        run: pnpm --filter api check:shared-runtime

      # Topological order: shared is built again before the API and the web.
      - name: Build
        run: pnpm build

      - name: Audit production dependencies (high and critical)
        run: pnpm audit --prod --audit-level high
